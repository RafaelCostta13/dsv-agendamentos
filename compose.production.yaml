name: dsv-agenda-production

x-production-app: &production-app
  image: dsv-agendamentos-production:${IMAGE_TAG:?Defina IMAGE_TAG como versão ou SHA do commit}
  build:
    context: .
    dockerfile: Dockerfile.production
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    - /rails/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
  environment: &runtime-environment
    RAILS_ENV: production
    APP_HOST: ${APP_HOST:?Defina APP_HOST}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Defina SECRET_KEY_BASE}
    ADMIN_ACCESS_ENABLED: ${ADMIN_ACCESS_ENABLED:-false}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-3}
    PUMA_WORKERS: ${PUMA_WORKERS:-0}
    PUMA_WORKER_TIMEOUT: ${PUMA_WORKER_TIMEOUT:-60}
    RAILS_PORT: ${RAILS_PORT:-3000}
    RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_APP_USER:?Defina POSTGRES_APP_USER}
    POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD}
    APP_DATABASE_ROLE: runtime
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks:
    - production
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Defina POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Defina POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?Defina POSTGRES_MIGRATION_USER}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Defina POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-application-roles.sh:/docker-entrypoint-initdb.d/10-create-application-roles.sh:ro
    networks:
      - production
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 64mb
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    <<: *production-app
    environment:
      RAILS_ENV: production
      APP_HOST: ${APP_HOST:?Defina APP_HOST}
      SECRET_KEY_BASE_DUMMY: "1"
      ADMIN_ACCESS_ENABLED: "false"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Defina POSTGRES_MIGRATION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Defina POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Defina POSTGRES_APP_USER}
      APP_DATABASE_ROLE: migration
    command: ["sh", "bin/production-migrate"]
    restart: "no"
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    volumes: []
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  web:
    <<: *production-app
    ports:
      - "127.0.0.1:${HOST_RAILS_PORT:-3000}:3000"
    volumes:
      - rails_storage:/rails/storage
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - "response = Net::HTTP.new('127.0.0.1', Integer(ENV.fetch('RAILS_PORT', '3000'))).get('/ready', {'Host' => ENV.fetch('APP_HOST')}); exit(response.code == '200' ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    <<: *production-app
    command: ["bundle", "exec", "ruby", "bin/no-show-worker"]
    volumes: []
    healthcheck:
      disable: true

volumes:
  postgres_data:
    name: dsv_agenda_production_postgres
  rails_storage:
    name: dsv_agenda_production_storage

networks:
  production:
    name: dsv_agenda_production_internal
    internal: true
