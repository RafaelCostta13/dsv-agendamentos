<% require "json" %>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 3) %>
  host: <%= ENV.fetch("POSTGRES_HOST", "db").to_json %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "dsv_doca_agenda").to_json %>
  password: <%= ENV["POSTGRES_PASSWORD"].to_json %>
  connect_timeout: 3
  checkout_timeout: 3

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "dsv_doca_agenda_development").to_json %>

test:
  <<: *default
  database: <%= "#{ENV.fetch("POSTGRES_DB", "dsv_doca_agenda_development")}_test".to_json %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "dsv_doca_agenda_production").to_json %>
